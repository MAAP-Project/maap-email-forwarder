[project]
name = "maap-email-forwarder"
version = "0.1.0"
description = "Project for forwarding emails within the MAAP infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.239.0",
    "constructs>=10.0.0,<11.0.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12",
    "email-validator==2.3.0",
    "boto3==1.42.55"
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff==0.15.2",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true

[tool.ruff]
