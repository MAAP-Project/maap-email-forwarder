[project]
name = "maap-email-forwarder"
version = "0.1.0"
description = "Project for forwarding emails within the MAAP infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.252.0",
    "aws-cdk.aws-lambda-python-alpha==2.252.0a0",
    "constructs>=10.6.0,<11.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "boto3==1.43.3"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0"
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
]
ignore = [
  "BLE001",  # Blind Exceptions
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.markdownlint-cli2.config]
MD013 = false

[tool.ruff.lint.isort]
combine-as-imports = true
