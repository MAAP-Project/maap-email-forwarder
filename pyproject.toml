[project]
name = "maap-email-forwarder"
version = "0.1.0"
description = "Project for forwarding emails within the MAAP infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.260.0",
    "aws-cdk.aws-lambda-python-alpha==2.260.0a0",
    "constructs>=10.6.0,<11.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "boto3==1.43.34"
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.14.0",
    "ruff==0.15.18",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true

[tool.ruff]
