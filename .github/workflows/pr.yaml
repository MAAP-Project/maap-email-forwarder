name: Pull Request Workflow

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FROM_EMAIL: ${{ vars.FROM_EMAIL }}
      SUBJECT_PREFIX: ${{ vars.SUBJECT_PREFIX }}
      EMAIL_BUCKET: ${{ vars.EMAIL_BUCKET }}
      EMAIL_KEY_PREFIX: ${{ vars.EMAIL_KEY_PREFIX }}
      FORWARD_MAPPING: ${{ vars.FORWARD_MAPPING }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE }}
          aws-region: 'us-west-2' # This should not be changed

      - name: CDK Diff
        run: uv run npx cdk diff --ci
