name: Deploy MAAP Email Forwarder

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FROM_EMAIL: ${{ vars.FROM_EMAIL }}
      SUBJECT_PREFIX: ${{ vars.SUBJECT_PREFIX }}
      EMAIL_BUCKET: ${{ vars.EMAIL_BUCKET }}
      EMAIL_KEY_PREFIX: ${{ vars.EMAIL_KEY_PREFIX }}
      FORWARD_MAPPING: ${{ vars.FORWARD_MAPPING }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE }}
          aws-region: 'us-west-2' # This should not be changed

      - name: CDK Synth
        run: uv run cdk synth

      - name: CDK Deploy
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: uv run cdk deploy --require-approval never --all
