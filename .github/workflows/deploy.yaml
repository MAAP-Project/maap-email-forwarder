name: Deploy MAAP Email Forwarder

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FROM_EMAIL: ${{ vars.FROM_EMAIL }}
      SUBJECT_PREFIX: ${{ vars.SUBJECT_PREFIX }}
      EMAIL_BUCKET: ${{ vars.EMAIL_BUCKET }}
      EMAIL_KEY_PREFIX: ${{ vars.EMAIL_KEY_PREFIX }}
      FORWARD_MAPPING: ${{ vars.FORWARD_MAPPING }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE }}
          aws-region: 'us-west-2' # This should not be changed

      - name: CDK Deploy
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: uv run npx cdk deploy --require-approval never --all
